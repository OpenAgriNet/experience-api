[project]
name = "experience-api"
version = "0.1.0"
description = "Experience API — the HTTP service between the OpenAgriNet web client and the DSS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    # The async HTTP client behind the DSS adapter. FastAPI's test transport is
    # built on it too, so it is one runtime dependency rather than one client
    # for prod and another for tests.
    "httpx>=0.28.1",
    "pydantic-settings>=2.5.0",
    "httpx-sse>=0.4.3",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

# src/experience_api does not match the distribution name, so the package path
# is explicit.
[tool.hatch.build.targets.wheel]
packages = ["src/experience_api"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.400",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    # Coverage is reported on every run (report-only, no gate) so regressions
    # are visible without blocking a merge — see addopts below.
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.1.5",
    "ruff>=0.16.4",
    "vulture>=2.14",
]

# ---------------------------------------------------------------------------
# Linting & formatting — ruff only; it replaces black, flake8, and isort. The
# same config as the DSS, so the two repos never drift (CONVENTIONS.md).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py313"
# Docs contain illustrative Python in fenced blocks whose alignment is
# deliberate. Formatting them rewrites the prose's meaning, so they are excluded.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
# `tests.support` is imported by test modules; without this, isort files it as
# third party.
known-first-party = ["experience_api", "tests"]

# Absolute imports only. A relative import hides which layer it reaches into,
# and `from .adapters import x` inside a feature is the easiest way to break the
# dependency rule. tests/test_boundaries.py resolves them anyway; this stops
# them being written.
[tool.ruff.lint.per-file-ignores]
# The vulture whitelist is `_.name` lines by design (see its docstring).
"vulture_whitelist.py" = ["B018", "F821"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Static analysis. pyright in `standard` mode is a gate, in pre-commit and CI.
# `venvPath`/`venv` point editors and the CLI at the project venv, since both
# default to the system interpreter and then cannot resolve the dependencies.
# ---------------------------------------------------------------------------
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"

# ---------------------------------------------------------------------------
# Tests. The `e2e` marker is excluded from the default run: that tier needs a
# running DSS. Run it deliberately with `pytest -m e2e`.
#
# The table must be `[tool.pytest.ini_options]`, not `[tool.pytest]` — pytest
# silently ignores the latter.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# tests/support/ holds shared test data that test modules import directly.
# Without this, `tests` is not importable and those imports fail.
pythonpath = ["."]
# --import-mode=importlib: test folders mirror src/, so sibling packages may
# each hold a `test_mapping.py`. Under the default prepend mode those collide on
# the module name; importlib gives each its own full path.
addopts = [
    "-ra",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not e2e",
    # Coverage is monitored, not gated: report the gaps every run, never fail
    # the build on a threshold.
    "--cov=src/experience_api",
    "--cov-report=term-missing",
]
# Async tests run under pytest-asyncio in auto mode, which claims every async
# test regardless of marker.
asyncio_mode = "auto"
markers = [
    "e2e: one turn against a real DSS; needs a running DSS",
]
strict_markers = true

# ---------------------------------------------------------------------------
# Dead code. vulture reports unused functions, classes, imports and variables,
# at its default confidence (60%). A false positive earns a line in
# `vulture_whitelist.py`, not a lower bar. The whitelist is one of the paths, so
# every name it mentions counts as used.
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["src", "tests", "vulture_whitelist.py"]
# FastAPI calls a decorated route; our code never names it. A router's HTTP-verb
# decorator therefore counts as a use. Extend this when another kind of
# decorated hook arrives (exception handlers, websockets).
ignore_decorators = [
    "@*.get", "@*.post", "@*.put", "@*.patch", "@*.delete",
    # pydantic calls these while serializing.
    "@model_serializer",
]
# pydantic's config hook, read by pydantic, never by our code.
ignore_names = ["model_config"]
