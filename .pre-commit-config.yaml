# Install once per clone:
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# Local hooks can be bypassed with `--no-verify`, so CI runs the same checks.

# Every hook runs on commit unless it names its own stage.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Recorded DSS streams are kept byte for byte: an SSE stream ends with a
      # blank line, and trimming it would drop the last frame.
      - id: trailing-whitespace
        exclude: ^tests/support/dss/
      - id: end-of-file-fixer
        exclude: ^tests/support/dss/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      # Types on every commit. `always_run`, because a change to pyproject.toml
      # alone can loosen the check. Runs from the project venv, not a hook venv,
      # so pyright sees the real dependencies.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
      # Dead code on every commit, whatever changed, for the same reason.
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        always_run: true
      # The full test suite before code leaves the machine (CONVENTIONS.md).
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
